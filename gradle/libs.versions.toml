# SPFN Mobile — Step 2 toolchain baseline.
#
# These versions implement decision D5 (confirmed 2026-08-01). They are a BUILD and
# PARITY baseline: they say what this repository compiles with, not which devices or
# OS releases are supported. COMPATIBILITY.md support rows stay UNRESOLVED until real
# device evidence exists.
#
# Every entry is the current stable patch of the approved line, recorded on 2026-08-01.
# Any addition here also needs real, network-fetched checksums in
# gradle/verification-metadata.xml, which is regenerated with:
#   ./gradlew --write-verification-metadata sha256 help

[versions]
agp = "9.2.1"
kotlin = "2.4.10"
foojay-resolver = "1.0.0"
junit = "4.13.2"
# CycloneDX SBOM generator (decision D7, 2026-08-03). On-demand only: the tasks it
# registers are never wired into assemble/build/check.
cyclonedx = "3.3.0"

# The Android SDK's only runtime dependency line, added with the transport module.
# `mockwebserver3` ships from the same release train, so it is versioned by `okhttp`.
okhttp = "5.4.0"
kotlinx-coroutines = "1.11.0"
# The Google Sign-In adapter's dependencies. Credential Manager is the current Android
# identity API — the one-tap `play-services-auth` sign-in surface is deprecated, and new
# code on a deprecated API is a migration scheduled for later at a worse moment.
# `credentials` is the API, `credentials-play-services-auth` is the provider that serves
# a Google account behind it, and `googleid` carries the Google-specific request option
# and the credential it returns. Latest stable as checked on 2026-08-04; the 1.7.0 line
# is alpha and the googleid line is at 1.2.0.
androidx-credentials = "1.6.0"
googleid = "1.2.0"

# The UI module's dependencies. Compose is the Android UI toolkit `spfn-ui` is written
# against and Navigation 3 is its back stack; both are Maven artifacts, so unlike SwiftUI
# on the other side they are named in tools/module-graph.json and pinned here. Latest
# stable as checked on 2026-09-02: Compose is at 1.11.4 and Navigation 3
# at 1.1.7 (1.2.0 is at beta01). No Compose BOM: the validator reads each module's
# dependency lines and a `platform(...)` wrapper is not a shape it can resolve to a
# catalogue alias, so every artifact carries its own version reference here instead.
androidx-compose = "1.11.4"
androidx-navigation3 = "1.1.7"
# Navigation 3 already brings this in; `spfn-ui` declares it because it uses it directly.
# BackHandler is androidx.activity.compose's — AndroidX Compose UI has no back handler of
# its own on Android, and the multiplatform `androidx.compose.ui.backhandler` package is
# not in the 1.12.0 Android artifact (checked by listing it). Latest stable 2026-09-02.
androidx-activity-compose = "1.12.4"

# Numeric baselines consumed by the module build scripts.
jdk-toolchain = "21"
min-sdk = "24"
compile-sdk = "36"
# targetSdk applies to applications only. The Maestro harness at tools/harness/android
# is the one application in this repository, and it applies this value.
target-sdk = "36"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "androidx-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
# Applied by the Maestro harness only (tools/harness/android). No SDK module is an
# application, and nothing this plugin builds is published.
android-application = { id = "com.android.application", version.ref = "agp" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# AGP 9.2.1 compiles Kotlin itself, and it turns the Compose feature on by asking whether
# THIS plugin is applied (`isComposeCompilerPluginApplied`, checked against the AGP 9.2.1
# jar rather than guessed). With Kotlin 2.x the Compose compiler ships inside the Kotlin
# release, so the plugin carries the Kotlin version and no separate compiler version
# exists to pin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
