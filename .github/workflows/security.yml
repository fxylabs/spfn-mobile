# NOT A GATE. Manual-only, and not one of the three required checks.
#
# D2 (partly resolved 2026-09-18) put every check that can run on a Linux runner under the
# CI referee. The offline half of "security" went with it: the validator's credential,
# key-file, cleartext, auth-boundary and hybrid-bridge rules all run on every pull request now,
# inside contract.yml. Restating them here would be a second copy of one gate.
#
# What is left in this file is what D2 leaves outside CI, and what does not exist yet:
#   - signature, checksum and source-to-artifact traceability. That is publication
#     evidence: it is produced by a signed release, the signing key exists only as a
#     GitHub secret, and a release is dispatched by a person (see publish-central.yml).
#     A pull-request job cannot produce it and must not imply it has.
#   - SPDX or CycloneDX SBOM generation. The CycloneDX tasks exist but are on-demand by
#     decision D7, and the SBOM that matters is a candidate's, not a branch's.
#   - secret, license and dependency scanning, and fuzzing of the canonical JSON parser and
#     the proof input builder. None of these is implemented. They are Linux-runnable, so
#     when they exist they belong under the CI referee, not here.
#
# Until then the honest security check is `sh tools/ci/validate.sh`, which contract.yml
# runs on every pull request.
name: security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    runs-on: ubuntu-24.04
    steps:
      - name: State repository status
        run: |
          echo "NOT A GATE: security scanning, fuzzing and SBOM generation are not implemented."
          echo "The offline security rules run on every pull request in contract.yml."
