# NOT A GATE, and outside the CI referee by decision.
#
# D2 (partly resolved 2026-09-18) put every Linux-runnable check under the three required
# workflows. A release candidate is the clearest case of what stays out: it is a signed,
# published artifact plus real-device evidence, and all three of those — macOS, hardware
# and publication — are what D2 leaves open.
#
# Concretely, what this file would have to do that a pull-request runner cannot:
#   - build on macOS, because `tools/rc-verify/rc-verify.sh` needs a Swift toolchain, an
#     Android SDK and the Apple half in one place;
#   - sign, with a key that exists only as a GitHub secret and is injected per run;
#   - clear `tools/device-receipts/receipt-gate.sh`, which rc-verify runs before it will
#     verify anything and which needs fifteen cells driven by a person on two real phones.
#     That gate is the one failure CI admits by name, in tools/ci/validate-known-red.txt.
#
# Manual-only, and deliberately inert besides. This file exists so the location is reserved
# and so nobody adds release automation somewhere less visible. It performs no build, holds
# no credential, and reads no secret.
#
# A successful candidate build is never approval to release. Before this file may do
# anything real, every one of these must be decided by a person:
#   - repository visibility and whether the source may be disclosed at all
#   - target registry, coordinates and account ownership
#   - credential custody and signing identity
#   - retention and immutability policy
#   - the exact source commit, tag, contract digest and artifact hashes being approved
#
# The blocker that was a missing capability is gone: the pinned contract bundle is an
# SPFN primitives export, taken at an exact commit (D17, resolved 2026-08-02). What
# remains is decisions and approvals, not machinery.
#
# Gates it must then implement:
#   - tag / VERSION / contract digest agreement
#   - sources, docs and POM metadata completeness
#   - SBOM, checksums and signatures
#   - clean-consumer integration from a fresh checkout
#   - the v2 acceptance suite T01-T48
#   - fresh independent review traceability
name: release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse to imply a release path exists
        run: |
          echo "NOT A GATE: no release candidate pipeline exists."
          echo "No artifact has been built, signed, uploaded or approved."
          exit 0
