# The contract gate. A required check: a pull request that reddens it does not merge.
#
# What it runs: `tools/ci/validate.sh`, which runs the offline validator; its exit code is
# this job's. That validator is where the contract
# evidence lives — the vendored bundle's real SHA-256 against the digest
# Contracts/upstream-provenance.json records, the lock's own claims against that same
# evidence file, the refusal of a lock that restates a value the evidence owns, the
# admitted SemVer window, the wire mapping constants on both platforms, and the generated
# sources' cross-platform agreement. So this file calls the validate script alone: the
# digest check is already inside it, and a second implementation of it here would be a
# second thing to keep true.
#
# Where the rest of the contract evidence is checked, so nobody adds it twice:
#   - `:contract-codegen:spfnCodegenVerify` — generated sources regenerate byte-identically
#     — runs in android.yml, the job that already has the Gradle and Android toolchain.
#   - `swift test --filter SPFNConformanceTests` is part of the whole Swift suite in
#     swift.yml; the Kotlin conformance suite is part of `testDebugUnitTest` in android.yml.
#
# This job needs no toolchain at all — the validator is POSIX sh — which is why it is also
# the fastest signal on a pull request.
#
# What it deliberately does not run: a breaking-contract diff against the previous contract
# version, and a re-verification of the pinned export against the SPFN primitives
# repository. Neither exists yet, and neither is blocked by D2.
#
# No failure is admitted. The device-receipt gate, which needs two real phones and a person,
# is not part of the validator: it is a manual command run before a release
# (COMPATIBILITY.md, "Device sign-in evidence") and inside tools/rc-verify/rc-verify.sh.
#
# Expected duration: under a minute — the validator takes 5 seconds on this repository's
# development VM. timeout-minutes is 20, which is the "something hung" line.
name: contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # The check GitHub reports is the job's name, and branch protection requires checks
    # by that name. Three jobs called `linux` would be one indistinguishable check, so
    # each job is named after its workflow: this one is `contract`.
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline validation
        run: sh tools/ci/validate.sh
