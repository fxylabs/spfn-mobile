# SPFN Mobile — Gradle properties.
#
# spfn.version must equal the repository VERSION file. Enforced by
# tools/validate/validate.sh and Tests/SPFNRepositoryTests.
spfn.version=0.1.0-alpha.2

# Publication is disabled and stays disabled. Flipping this to true is a release
# decision, not a build decision: it requires an approved registry target,
# coordinates, credential custody and signing identity. None of those exists.
spfn.publishing.enabled=false

# Maven group, decision D4 (resolved 2026-08-03): the xyz.superfunction namespace is
# domain-verified on the Central Portal, so this is a real coordinate. What this does
# NOT mean: that anything is published. Publication needs the workflow_dispatch path,
# registered secrets and a person, none of which this file provides.
#
# No credential, token or signing key may ever appear in this file. Signing and Central
# credentials are looked up per-run from the environment (ORG_GRADLE_PROJECT_*), and
# tools/validate/validate.sh fails if a credential-shaped key is committed here.
spfn.maven.group=xyz.superfunction.spfn
spfn.maven.group.verified=true

# The Kotlin 2.4 compiler and AGP 9 run out of the default 384 MiB metaspace on this
# module graph, which stops the daemon mid-build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=false
