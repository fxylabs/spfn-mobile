# SPFN Mobile — the iOS harness app's project, as data.
#
#   xcodegen generate --spec tools/harness/ios/project.yml
#
# This file is the source; SPFNHarness.xcodeproj is the generated artifact and is
# gitignored (.gitignore already ignores *.xcodeproj/). The repository keeps one
# hand-edited project file nowhere: the CocoaPods fixture is generated from
# tools/module-graph.json for the same reason, and a committed project.pbxproj is a
# thousand lines nobody can review.
#
# The harness is not a sample and is never published. It exists so a Maestro flow has
# an app to drive — decision 01kzb8tjxp (D-1, D-2).
#
# No signing identity is configured here on purpose: the validator forbids credential
# and provisioning files in the tree. A simulator build passes CODE_SIGNING_ALLOWED=NO
# and a device build passes DEVELOPMENT_TEAM, both from the runner's command line.

name: SPFNHarness

options:
  bundleIdPrefix: xyz.superfunction.spfn
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SPFNMobile:
    path: ../../..

targets:
  SPFNHarness:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: SPFNMobile
        product: SPFNCore
      - package: SPFNMobile
        product: SPFNAuth
      - package: SPFNMobile
        product: SPFNGenerated
      - package: SPFNMobile
        product: SPFNClient
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SPFN Harness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    # The harness stores its key in the real keychain, and the keychain answers nothing to
    # an app with no entitlements. An unsigned simulator build has none, so every store
    # call failed with -34018 and the state label read `unreadable` — the first run after
    # the identifier fix spent itself finding exactly this.
    #
    # The group is written with $(AppIdentifierPrefix) because a device's provisioning
    # profile grants `<team id>.*` and rejects any group outside it: a bare group fails
    # the build with a keychain-access-groups mismatch, which is what the first device
    # run met. The prefix resolves to the team id there, and no team id is written here —
    # the runner supplies it, and the repository still holds no signing material.
    #
    # This changes nothing for a simulator, which was measured rather than assumed. An
    # ad-hoc simulator build embeds an empty entitlements dictionary and always did: the
    # processed `.xcent` is `{}` with the prefix and `{}` without it. The keychain still
    # answers there because an app with no access group gets its bundle id as one. So
    # this file's entitlement is a device concern, and the simulator is unaffected.
    entitlements:
      path: Generated/SPFNHarness.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)xyz.superfunction.spfn.harness
    settings:
      base:
        # Ad-hoc, and it is the signature rather than the entitlement above that makes a
        # simulator run work: signing at all is what gives the app an identifier for the
        # keychain to answer. It names no identity, so nothing here is a credential. A
        # device build overrides both of these from the runner's command line with a real
        # team and automatic signing — see the device procedure in the README.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: xyz.superfunction.spfn.harness
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
