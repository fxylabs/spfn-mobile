# SPFN Mobile — the iOS harness app's project, as data.
#
#   xcodegen generate --spec tools/harness/ios/project.yml
#
# This file is the source; SPFNHarness.xcodeproj is the generated artifact and is
# gitignored (.gitignore already ignores *.xcodeproj/). The repository keeps one
# hand-edited project file nowhere: the CocoaPods fixture is generated from
# tools/module-graph.json for the same reason, and a committed project.pbxproj is a
# thousand lines nobody can review.
#
# The harness is not a sample and is never published. It exists so a Maestro flow has
# an app to drive — decision 01kzb8tjxp (D-1, D-2).
#
# No signing identity is configured here on purpose: the validator forbids credential
# and provisioning files in the tree. A simulator build passes CODE_SIGNING_ALLOWED=NO
# and a device build passes DEVELOPMENT_TEAM, both from the runner's command line.

name: SPFNHarness

options:
  bundleIdPrefix: xyz.superfunction.spfn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# The harness needs the `SocialGoogle` trait on: Google's own SDK is resolved and linked
# only under it, and `SPFNSocialGoogle.init(presenting:)` — the one call that puts a real
# sheet in front of a person — lives inside the `#if SocialGoogle` block. A harness built
# with the trait off compiles the adapter and has no way to reach a sheet through it.
#
# Xcode cannot turn a trait on. XcodeGen writes `traits = (...)` into the
# `XCLocalSwiftPackageReference` and Xcode 26.2 ignores it: measured, not assumed — a
# probe project with those exact lines resolved zero remote packages and failed to see
# `SPFNGooglePresentingContext`, and the same probe with the manifest below built and
# resolved GoogleSignIn 9.2.0. So the trait is declared where SwiftPM does read it, in a
# manifest: `HarnessSupport/Package.swift`, whose only job is to depend on this
# repository with both traits enabled. Adding it to the graph turns them on for every
# copy of the package in that graph, which is why the products below are still taken
# straight from `SPFNMobile`.
packages:
  SPFNMobile:
    path: ../../..
  SPFNHarnessSupport:
    path: HarnessSupport

targets:
  SPFNHarness:
    type: application
    platform: iOS
    # Two directories, and the split is the point. `Sources` is the human's: the screen,
    # the model, the transport and the receipt. `GeneratedUI` is tools/ui-codegen's and
    # nothing in it is edited by hand — the harness is the SECOND consumer of the one
    # screen spec, and it drives those screens against a live reference server rather
    # than against a fixture.
    #
    # NOT `Generated/`, which is XcodeGen's own: the Info.plist and the entitlements
    # below are written there, and the ui generator DELETES every file it did not emit
    # from a directory it owns. One directory, one owner.
    sources:
      - path: Sources
      - path: GeneratedUI
    # Every value the device mode reads comes from here, and none of it is committed.
    # The tracked file declares the keys empty and then optionally includes the
    # gitignored `Local.xcconfig`, so a clean checkout builds and the app reports itself
    # unconfigured rather than crashing on a value nobody supplied.
    configFiles:
      Debug: Harness.xcconfig
      Release: Harness.xcconfig
    dependencies:
      - package: SPFNMobile
        product: SPFNCore
      - package: SPFNMobile
        product: SPFNAuth
      - package: SPFNMobile
        product: SPFNGenerated
      - package: SPFNMobile
        product: SPFNClient
      # `Flow`, `FlowHost`, `Busy` and `Loadable`: what everything under GeneratedUI is
      # written against. The example app takes the same product for the same files.
      - package: SPFNMobile
        product: SPFNUI
      # Carries the two adapter modules, and the traits that make them whole. The app
      # imports `SPFNHarnessSupport` rather than the adapters directly, so what it can
      # reach is what this one product re-exports rather than whatever else happened to
      # land in the build products directory.
      - package: SPFNHarnessSupport
        product: SPFNHarnessSupport
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: SPFN Harness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # A receipt is only evidence if someone can read it off the phone, so the
        # Documents directory is exposed to Finder and to the Files app. Nothing but
        # receipts is written there, and a receipt carries no token by construction.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Google's SDK reads its client id from here and raises an NSException — not an
        # error a Swift caller can catch — when it is missing or when the reversed-client-id
        # scheme below is not registered. Both are empty in a clean checkout, which is
        # exactly why HarnessConfiguration refuses to call Google until it has checked
        # both itself.
        GIDClientID: $(SPFN_HARNESS_GOOGLE_CLIENT_ID)
        # The verify server, as host and port rather than as a URL: `//` opens a comment
        # in an xcconfig, so a whole URL in Local.xcconfig would silently truncate to
        # `http:`. Two keys cannot do that.
        SPFNHarnessServerHost: $(SPFN_HARNESS_SERVER_HOST)
        SPFNHarnessServerPort: $(SPFN_HARNESS_SERVER_PORT)
        CFBundleURLTypes:
          - CFBundleURLName: xyz.superfunction.spfn.harness.google
            CFBundleURLSchemes:
              - $(SPFN_HARNESS_GOOGLE_REVERSED_CLIENT_ID)
        # The narrowest exception iOS offers for what this actually needs: a phone
        # reaching a verify server on the same wifi over plain http. `NSAllowsLocalNetworking`
        # permits insecure loads to .local names, unqualified host names and the private
        # and link-local address ranges — and nothing else. `NSAllowsArbitraryLoads` would
        # have opened every host on the internet to answer the same question.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS 14 and later ask the person before an app may reach the local network at
        # all, and an app with no purpose string is refused without a prompt.
        NSLocalNetworkUsageDescription: >-
          The harness enrols a key against an SPFN verify server running on this network.
    # The harness stores its key in the real keychain, and the keychain answers nothing to
    # an app with no entitlements. An unsigned simulator build has none, so every store
    # call failed with -34018 and the state label read `unreadable` — the first run after
    # the identifier fix spent itself finding exactly this.
    #
    # The group is written with $(AppIdentifierPrefix) because a device's provisioning
    # profile grants `<team id>.*` and rejects any group outside it: a bare group fails
    # the build with a keychain-access-groups mismatch, which is what the first device
    # run met. The prefix resolves to the team id there, and no team id is written here —
    # the runner supplies it, and the repository still holds no signing material.
    #
    # This changes nothing for a simulator, which was measured rather than assumed. An
    # ad-hoc simulator build embeds an empty entitlements dictionary and always did: the
    # processed `.xcent` is `{}` with the prefix and `{}` without it. The keychain still
    # answers there because an app with no access group gets its bundle id as one. So
    # this file's entitlement is a device concern, and the simulator is unaffected.
    #
    # `com.apple.developer.applesignin` is what makes the real Apple sheet appear on a
    # device, and it is the one entitlement here that costs something: Sign in with Apple
    # is a paid-programme capability, so a free personal team can no longer sign this
    # target. The custody probe never needed it — that run stays possible with
    # `CODE_SIGN_ENTITLEMENTS=""` on the xcodebuild command line, which drops both keys
    # for that build only. The README says so beside the procedure.
    entitlements:
      path: Generated/SPFNHarness.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)xyz.superfunction.spfn.harness
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        # Ad-hoc, and it is the signature rather than the entitlement above that makes a
        # simulator run work: signing at all is what gives the app an identifier for the
        # keychain to answer. It names no identity, so nothing here is a credential. A
        # device build overrides both of these from the runner's command line with a real
        # team and automatic signing — see the device procedure in the README.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: xyz.superfunction.spfn.harness
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
