# SPFN Mobile — case c2-rotate-from-unenrolled: rotating with no key is refused
#
# One cell of the lifecycle's case table. The table is three states by three operations,
# closed before any of this was written, and every cell has a flow: tools/harness/README.md
# carries it. This file asserts one cell and nothing else.

appId: ${APP_ID}
name: c2-rotate-from-unenrolled
---
- runFlow: prelude-clean.yaml

- tapOn:
    id: "btn_rotate"

- extendedWaitUntil:
    visible:
      text: "busy=ready"
    timeout: 20000

- assertVisible:
    text: "outcome=err:notEnrolled"

- assertVisible:
    text: "state=unenrolled"
