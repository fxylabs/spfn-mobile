# SPFN Mobile — reaching `rotationPending`, for the three cases that start there.
#
# There is exactly one way into this state and it is not a back door. `rotate()` persists
# the rotation candidate BEFORE it sends, and a transport failure — no response at all —
# leaves the candidate in place, because the server may or may not have applied the
# request. That ambiguity is the state.
#
# So the flow drops the network, rotates into the failure, and puts the network back. The
# `connectivity` assertion in the middle is what distinguishes this from a rotation that
# failed for some other reason and left no candidate at all: those states look identical
# from the state label and completely different from the outcome label.
#
# The network switch is a harness button over the injected transport, not an SDK change.

appId: ${APP_ID}
---
- runFlow: reach-enrolled.yaml

- tapOn:
    id: "btn_block_network"

- tapOn:
    id: "btn_rotate"

- extendedWaitUntil:
    visible:
      text: "busy=ready"
    timeout: 20000

- assertVisible:
    text: "outcome=err:connectivity"

- tapOn:
    id: "btn_open_network"

- assertVisible:
    text: "state=rotationPending"
